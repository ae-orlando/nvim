-- stylua.toml
-- StyLua configuration for NikaVim

column_width = 120
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
trailing_comma = "Always"
space_around_table_field_list = true
space_inside_square_brackets = false
space_inside_curly_braces = true
no_call_parentheses = ["vim.keymap.set", "vim.api.nvim_create_autocmd", "vim.api.nvim_create_user_command"]