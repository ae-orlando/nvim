name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: ${{ runner.temp }}/nikavim-data
      XDG_STATE_HOME: ${{ runner.temp }}/nikavim-state
      XDG_CACHE_HOME: ${{ runner.temp }}/nikavim-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: "v0.10.4"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find make python3 python3-pip nodejs npm
          python3 -m pip install --user pynvim

      - name: Cache Neovim
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nikavim-data
            ${{ runner.temp }}/nikavim-state
            ${{ runner.temp }}/nikavim-cache
          key: nvim-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}
          restore-keys: |
            nvim-${{ runner.os }}-

      - name: Install plugins
        run: nvim --headless -u "$GITHUB_WORKSPACE/init.lua" "+Lazy! sync" +qa

      - name: Validate Lua files and plugin specifications
        run: |
          nvim --headless -u NONE \
            "+lua for _, file in ipairs(vim.fn.glob('$GITHUB_WORKSPACE/lua/**/*.lua', false, true)) do assert(loadfile(file), file) end" \
            "+lua package.path = '$GITHUB_WORKSPACE/lua/?.lua;$GITHUB_WORKSPACE/lua/?/init.lua;' .. package.path" \
            "+lua assert(type(dofile('$GITHUB_WORKSPACE/lua/plugins/init.lua')) == 'table')" \
            +qa

      - name: Run Stylua
        run: |
          cargo install stylua
          stylua --check lua/

      - name: Run Luacheck
        run: |
          sudo apt-get install -y luacheck
          luacheck lua/

      - name: Run health check
        run: |
          set -euo pipefail
          nvim --headless -u "$GITHUB_WORKSPACE/init.lua" \
            "+checkhealth nikavim" \
            '+lua assert((vim.g.nikavim_health_errors or 0) == 0, "NikaVim health reported core errors")' \
            +qa

      - name: Check lockfile coverage
        run: |
          nvim --headless -u "$GITHUB_WORKSPACE/init.lua" \
            '+lua local names = {}; for _, plugin in pairs(require("lazy").plugins()) do names[plugin.name] = true end; local lines = {}; for name in pairs(names) do table.insert(lines, name) end; table.sort(lines); vim.fn.writefile(lines, vim.fn.stdpath("cache") .. "/nikavim-plugins.txt")' \
            +qa
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("lazy-lock.json").read_text())
          discovered = Path(os.environ["XDG_CACHE_HOME"]) / "nvim" / "nikavim-plugins.txt"
          names = {line.strip() for line in discovered.read_text().splitlines() if line.strip()}
          missing = sorted(names - set(lock))
          if missing:
              raise SystemExit("Plugins missing from lazy-lock.json: " + ", ".join(missing))
          PY

      - name: Verify startup
        run: |
          nvim --headless -u "$GITHUB_WORKSPACE/init.lua" \
            '+lua assert(vim.v.errmsg == "", vim.v.errmsg)' \
            '+lua print("Startup OK")' +qa

      - name: Smoke test buffer events
        run: |
          nvim --headless -u "$GITHUB_WORKSPACE/init.lua" \
            '+edit lua/core/options.lua' \
            '+setfiletype lua' \
            '+startinsert' \
            '+stopinsert' \
            '+lua assert(vim.v.errmsg == "", vim.v.errmsg)' \
            +qa

  build-docs:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation files exist
        run: |
          test -f README.md
          test -f SETUP.md
          test -f KEYMAPS.md
          test -f ADVANCED.md
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          echo "All documentation files present"